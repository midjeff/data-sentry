[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sentry-backend"
version = "0.1.0"
description = "Local durable API and isolated worker for DATA Sentry"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "Pillow>=11.2,<13",
  "psycopg[binary]>=3.3.6,<4", "httpx>=0.28,<1",
  "vercel-blob==0.5.0", "vercel-queue==0.9.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
sentry-worker = "sentry.worker:main"

[tool.setuptools.packages.find]
include = ["sentry*"]

[tool.setuptools.package-data]
sentry = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: requires FFmpeg and ffprobe"]

[[tool.vercel.subscribers]]
entrypoint = "sentry.cloud_tasks"

